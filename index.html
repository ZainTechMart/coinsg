<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Demo - Virtual Betting Game</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#10131a;
  color:white;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:500px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  font-size:30px;
  margin-bottom:8px;
}

.header p{
  color:#9da5b4;
}

.balance{
  background:#1b202b;
  border:1px solid #303746;
  border-radius:15px;
  padding:20px;
  text-align:center;
  margin-bottom:20px;
}

.balance span{
  display:block;
  color:#9da5b4;
  margin-bottom:8px;
}

.balance strong{
  font-size:30px;
}

.game-card{
  background:#1b202b;
  border:1px solid #303746;
  border-radius:15px;
  padding:20px;
}

.game-card h2{
  text-align:center;
  margin-bottom:20px;
}

.bet-label{
  display:block;
  margin-bottom:8px;
  color:#cbd1dc;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #3a4252;
  background:#11151d;
  color:white;
  font-size:16px;
  margin-bottom:18px;
}

.choice{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.choice button{
  flex:1;
  padding:15px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.red{
  background:#d9363e;
}

.green{
  background:#16a36a;
}

.selected{
  outline:3px solid white;
}

.play{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#f5b700;
  color:#111;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.play:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.result{
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  background:#11151d;
  text-align:center;
  min-height:50px;
}

.history{
  margin-top:20px;
  background:#1b202b;
  border:1px solid #303746;
  border-radius:15px;
  padding:20px;
}

.history h3{
  margin-bottom:15px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #303746;
  font-size:14px;
}

.win{
  color:#20d88a;
}

.lose{
  color:#ff5d67;
}

.note{
  margin-top:20px;
  text-align:center;
  color:#858d9c;
  font-size:12px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎮 Lucky Demo</h1>
    <p>Virtual Coins Learning Game</p>
  </div>

  <div class="balance">
    <span>Virtual Balance</span>
    <strong>🪙 <span id="balance">1000</span></strong>
  </div>

  <div class="game-card">

    <h2>🔴 Red or 🟢 Green?</h2>

    <label class="bet-label">
      Virtual Coins to Bet
    </label>

    <input
      type="number"
      id="betAmount"
      placeholder="Enter coins"
      min="1"
      value="50"
    >

    <div class="choice">

      <button
        class="red"
        id="redBtn"
        onclick="selectChoice('Red')"
      >
        🔴 Red
      </button>

      <button
        class="green"
        id="greenBtn"
        onclick="selectChoice('Green')"
      >
        🟢 Green
      </button>

    </div>

    <button
      class="play"
      id="playBtn"
      onclick="playGame()"
    >
      🎲 Play Round
    </button>

    <div class="result" id="result">
      Select Red or Green and play.
    </div>

  </div>

  <div class="history">

    <h3>📜 Game History</h3>

    <div id="historyList">
      <p style="color:#858d9c">
        No games played yet.
      </p>
    </div>

  </div>

  <div class="note">
    This is a learning/demo game using virtual coins only.
    No real-money betting, deposits or withdrawals.
  </div>

</div>

<script>

let balance = 10000;
let selectedChoice = "";

const balanceEl = document.getElementById("balance");
const resultEl = document.getElementById("result");
const historyList = document.getElementById("historyList");

function updateBalance(){

  balanceEl.textContent = balance;

}

function selectChoice(choice){

  selectedChoice = choice;

  document.getElementById("redBtn")
    .classList.remove("selected");

  document.getElementById("greenBtn")
    .classList.remove("selected");

  if(choice === "Red"){

    document.getElementById("redBtn")
      .classList.add("selected");

  }else{

    document.getElementById("greenBtn")
      .classList.add("selected");

  }

  resultEl.textContent =
    "You selected " + choice + ". Now play the round.";

}

function playGame(){

  const betInput =
    document.getElementById("betAmount");

  const bet =
    Number(betInput.value);

  if(!selectedChoice){

    resultEl.textContent =
      "⚠️ Please select Red or Green first.";

    return;
  }

  if(!bet || bet <= 0){

    resultEl.textContent =
      "⚠️ Enter a valid coin amount.";

    return;
  }

  if(bet > balance){

    resultEl.textContent =
      "⚠️ You don't have enough virtual coins.";

    return;
  }

  // Random result
  const randomNumber =
    Math.random();

  const winningChoice =
    randomNumber < 0.5 ? "Red" : "Green";

  const won =
    selectedChoice === winningChoice;

  if(won){

    // Demo reward: 1x profit
    balance += bet;

    resultEl.innerHTML =
      "🎉 <b>You Won!</b><br>" +
      "Result: " + winningChoice +
      "<br>+" + bet + " virtual coins";

  }else{

    balance -= bet;

    resultEl.innerHTML =
      "😔 <b>You Lost!</b><br>" +
      "Result: " + winningChoice +
      "<br>-" + bet + " virtual coins";

  }

  updateBalance();

  addHistory(
    selectedChoice,
    winningChoice,
    bet,
    won
  );

  if(balance <= 0){

    resultEl.innerHTML +=
      "<br><br>🪙 Virtual balance finished. Refresh the page to restart.";

    document.getElementById("playBtn")
      .disabled = true;

  }

}

function addHistory(
  choice,
  result,
  bet,
  won
){

  if(historyList.innerHTML.includes(
    "No games played yet"
  )){

    historyList.innerHTML = "";

  }

  const item =
    document.createElement("div");

  item.className =
    "history-item";

  item.innerHTML = `

    <span>
      You: ${choice}<br>
      Result: ${result}
    </span>

    <strong class="${won ? "win" : "lose"}">
      ${won ? "+" : "-"}${bet}
    </strong>

  `;

  historyList.prepend(item);

}

updateBalance();

</script>

</body>
  </html>
